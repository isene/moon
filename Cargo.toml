[package]
name = "moon"
version = "0.1.2"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "The Moon as it looks tonight: the near side lit for its phase, with the days around it. Built on crust and orbit."
license = "Unlicense"
repository = "https://github.com/isene/moon"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
orbit = { version = "0.1.5", path = "../orbit", package = "fe2o3-orbit" }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
